name: Clinica CI/CD Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew

    - name: Build with Gradle
      run: ./gradlew build --no-daemon

    - name: Run unit tests
      run: ./gradlew test

    - name: SonarQube Scan
      env:
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
      run: |
        echo "Running SonarQube analysis..."
        if [ -z "$SONAR_HOST_URL" ] || [ -z "$SONAR_TOKEN" ]; then
          echo "Required secrets SONAR_HOST_URL or SONAR_TOKEN are missing"
          exit 1
        fi
        CMD=("./gradlew" "sonarqube" "-Dsonar.host.url=${SONAR_HOST_URL}" "-Dsonar.login=${SONAR_TOKEN}")
        if [ -n "$SONAR_PROJECT_KEY" ]; then
          CMD+=("-Dsonar.projectKey=${SONAR_PROJECT_KEY}")
          echo "Using SONAR_PROJECT_KEY: ${SONAR_PROJECT_KEY}"
        fi
        "${CMD[@]}"

  deploy-to-dockerhub:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Extract version from build.gradle
      id: extract_version
      run: echo "VERSION=$(grep '^version =' build.gradle | sed -e 's/version = //' -e \"s/'//g\")" >> $GITHUB_ENV

    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: srikanthkakumanu/clinica:${{ env.VERSION }}
