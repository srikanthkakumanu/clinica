plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.4'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
    id 'com.bmuschko.docker-java-application' version '9.4.0'
}

group = 'com.clinica'
version = '1.0'
description = 'Simple Microservice for a Clinic'

group = 'com.clinica'
version = '1.0'
description = 'Simple Microservice for a Clinic'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-hateoas'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.5'
    implementation 'com.h2database:h2'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()

    testLogging {
        events "passed", "skipped", "failed"

        showExceptions true
        exceptionFormat "full"
        showCauses true
        showStackTraces true

        showStandardStreams = false
    }
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

// Docker Configuration
task dockerBuild(type: com.bmuschko.gradle.docker.tasks.image.DockerBuildImage) {
    group = 'docker'
    description = 'Build Docker image for the application'

    dependsOn build
    dockerFile = file('Dockerfile')
    inputDir = file('.')
    images.add("clinica:${project.version}")
    images.add("clinica:latest")
}

task dockerPush(type: Exec) {
    group = 'docker'
    description = 'Push Docker image to Docker Hub'

    dependsOn dockerBuild

    doFirst {
        def dockerHubUsername = System.getenv('DOCKER_HUB_USERNAME')
        def dockerHubPassword = System.getenv('DOCKER_HUB_PASSWORD')

        if (!dockerHubUsername || !dockerHubPassword) {
            throw new GradleException("Environment variables DOCKER_HUB_USERNAME and DOCKER_HUB_PASSWORD must be set")
        }

        commandLine 'sh', '-c', """
            echo "${dockerHubPassword}" | docker login -u "${dockerHubUsername}" --password-stdin
            docker tag clinica:${project.version} ${dockerHubUsername}/clinica:${project.version}
            docker tag clinica:latest ${dockerHubUsername}/clinica:latest
            docker push ${dockerHubUsername}/clinica:${project.version}
            docker push ${dockerHubUsername}/clinica:latest
        """
    }
}

task dockerRun(type: com.bmuschko.gradle.docker.tasks.container.DockerCreateContainer) {
    group = 'docker'
    description = 'Run Docker container locally'

    dependsOn dockerBuild
    targetImageId { "clinica:${project.version}" }
    containerName = 'clinica-app'
    hostConfig.portBindings = ['9091:9091']
    envVars = [
        'SPRING_PROFILES_ACTIVE': 'prod'
    ]
}

task dockerClean(type: Exec) {
    group = 'docker'
    description = 'Clean up Docker images and containers'

    commandLine 'sh', '-c', '''
        docker stop clinica-app || true
        docker rm clinica-app || true
        docker rmi clinica:latest clinica:1.0 || true
        docker system prune -f
    '''
}
